<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="/HA.png">
  <title>Tử Vi Hồng Ân - Gieo Quẻ Kiều</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bk-gold: #c9a227;
      --bk-gold-light: #fef08a;
      --bk-gold-glow: rgba(201, 162, 39, 0.45);
      --bk-red-primary: #8b1d1d;
      --bk-red-dark: #701414;
      --bk-cream: #f8fafc;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Be Vietnam Pro', -apple-system, BlinkMacSystemFont, sans-serif;
      color: #1e293b;
      min-height: 100vh;
      overflow-x: hidden;
      background-color: #f8fafc;
      padding: 24px 20px;
    }

    /* CONTAINER CHÍNH: 3 LỀ TRẮNG ĐỒNG BỘ (max-width: 1220px) */
    .boikieu-page {
      max-width: 1220px;
      width: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    /* BÀN QUAY BÓI QUẺ: NỀN TRANH NGUYÊN BẢN (KHÔNG LỚP PHỦ ĐEN MỜ) */
    .boikieu-stage-container {
      position: relative;
      width: 100%;
      aspect-ratio: 1672 / 941;
      background-image: url('nen-tarot-kieu.png');
      background-position: center center;
      background-size: cover;
      background-repeat: no-repeat;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.12);
      border: 1px solid rgba(201, 162, 39, 0.35);
      user-select: none;
    }

    /* VÒNG QUAY QUẺ: LỚN HƠN & NÂNG CAO LÊN CÂN ĐỐI THỊ GIÁC */
    .wheel-wrapper {
      position: absolute;
      top: 51.5%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: min(365px, 40%);
      height: min(365px, 40%);
      aspect-ratio: 1 / 1;
      z-index: 5;
    }

    .pointer {
      position: absolute;
      top: -18px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 14px solid transparent;
      border-right: 14px solid transparent;
      border-top: 26px solid var(--bk-gold);
      filter: drop-shadow(0 3px 6px rgba(0, 0, 0, 0.75));
      z-index: 10;
      transition: all 0.2s ease;
    }

    .wheel {
      width: 100%;
      height: 100%;
      position: relative;
      border-radius: 50%;
      overflow: hidden;
      filter: drop-shadow(0 0 22px var(--bk-gold-glow));
    }

    .wheel-image {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
      border-radius: 50%;
      user-select: none;
      -webkit-user-drag: none;
    }

    /* NÚT XIN QUẺ: HIỆU ỨNG THỞ (BREATHING/PULSING) VÀ VIỀN GRADIENT ĐỘNG */
    .stage-controls {
      position: absolute;
      top: calc(51.5% + min(182.5px, 20%) + 12px);
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      z-index: 6;
      width: 90%;
      max-width: 400px;
      text-align: center;
    }

    .spin-btn {
      position: relative;
      padding: 2.5px;
      border-radius: 40px;
      border: none;
      background: transparent;
      cursor: pointer;
      overflow: hidden;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 15px rgba(201, 162, 39, 0.4);
      animation: btnPulse 2.4s infinite ease-in-out;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
    }

    .spin-btn::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: conic-gradient(from 0deg,
          #ffd700,
          #fff3a8,
          #c5a059,
          #8b1d1d,
          #d4af37,
          #fff9c4,
          #ffd700);
      animation: rotateBorder 3s linear infinite;
      z-index: 1;
    }

    .spin-btn-inner {
      position: relative;
      z-index: 2;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 7px 30px;
      border-radius: 38px;
      background: linear-gradient(145deg, #d4af37, #a07d1a);
      color: #1a0f0a;
      font-family: 'Be Vietnam Pro', sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 1px;
      transition: background 0.2s ease, color 0.2s ease;
      width: 100%;
      height: 100%;
      box-sizing: border-box;
    }

    @keyframes rotateBorder {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }

    @keyframes btnPulse {
      0% {
        transform: scale(1);
        box-shadow: 0 4px 14px rgba(201, 162, 39, 0.35);
      }

      50% {
        transform: scale(1.05);
        box-shadow: 0 7px 22px rgba(201, 162, 39, 0.7), 0 0 12px rgba(254, 240, 138, 0.45);
      }

      100% {
        transform: scale(1);
        box-shadow: 0 4px 14px rgba(201, 162, 39, 0.35);
      }
    }

    .spin-btn:hover:not(:disabled) {
      transform: translateY(-2px) scale(1.07);
      box-shadow: 0 8px 24px rgba(201, 162, 39, 0.8), 0 0 16px rgba(254, 240, 138, 0.6);
    }

    .spin-btn:hover:not(:disabled) .spin-btn-inner {
      background: linear-gradient(145deg, #e5c158, #b88f24);
    }

    .spin-btn:active:not(:disabled) {
      transform: translateY(0) scale(0.98);
    }

    .spin-btn:disabled {
      animation: none;
      opacity: 0.65;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .spin-btn:disabled::before {
      animation: none;
    }

    .result-number {
      font-size: clamp(0.82rem, 1.4vw, 0.95rem);
      color: var(--bk-gold-light);
      min-height: 24px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-shadow: 0 2px 5px rgba(0, 0, 0, 0.9);
    }

    /* BẢNG LIỆT KÊ CÁC QUẺ KIỀU */
    .boikieu-cards-section {
      width: 100%;
      background: #ffffff;
      border-radius: 16px;
      padding: 28px 24px 60px;
      border: 1px solid #e2e8f0;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
    }

    .cards-section-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .cards-main-title {
      font-size: clamp(1.2rem, 3vw, 1.65rem);
      font-weight: 700;
      color: var(--bk-red-primary);
      letter-spacing: 1.2px;
      margin-bottom: 4px;
    }

    .cards-sub-title {
      font-size: 0.88rem;
      color: #64748b;
      font-style: italic;
      margin-bottom: 10px;
    }

    .title-divider {
      width: 100px;
      height: 2px;
      background: linear-gradient(90deg, transparent, #c5a059, transparent);
      margin: 0 auto;
    }

    /* GRID HIỂN THỊ CÁC THẺ QUẺ */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px;
      justify-items: center;
    }

    @media (max-width: 1024px) {
      .cards-grid {
        grid-template-columns: repeat(3, 1fr);
        gap: 16px;
      }
    }

    @media (max-width: 768px) {
      .cards-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
      }

      .boikieu-cards-section {
        padding: 20px 12px 40px;
      }

      .hint-click {
        display: none !important;
      }

      .pointer {
        top: -12px;
        border-left: 9px solid transparent;
        border-right: 9px solid transparent;
        border-top: 18px solid var(--bk-gold);
        filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.65));
      }
    }

    @media (max-width: 480px) {
      .cards-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
      }

      .stage-controls {
        top: calc(51.5% + min(182.5px, 20%) + 4px);
        gap: 2px;
      }

      .pointer {
        top: -8px;
        border-left: 6px solid transparent;
        border-right: 6px solid transparent;
        border-top: 12px solid var(--bk-gold);
        filter: drop-shadow(0 1.5px 3px rgba(0, 0, 0, 0.6));
      }

      .spin-btn-inner {
        padding: 5px 20px;
        font-size: 0.82rem;
        letter-spacing: 0.5px;
      }
    }

    /* THIẾT KẾ CARD: BẢO VỆ GÓC BO CONG, KHÔNG VỠ BỐ CỤC */
    .card {
      width: 100%;
      max-width: 270px;
      background: #ffffff;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #e2e8f0;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.05);
      cursor: pointer;
      transition: transform 0.22s ease, box-shadow 0.22s ease, border-color 0.22s ease;
      display: flex;
      flex-direction: column;
      isolation: isolate;
      transform: translateZ(0);
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: var(--bk-red-primary);
      box-shadow: 0 10px 24px rgba(139, 29, 29, 0.2);
    }

    .card.main-card {
      border: 2px solid #c5a059;
      box-shadow: 0 0 18px rgba(197, 160, 89, 0.5);
      animation: glowMain 2s infinite alternate ease-in-out;
    }

    @keyframes glowMain {
      0% {
        box-shadow: 0 0 8px rgba(197, 160, 89, 0.35);
      }

      100% {
        box-shadow: 0 0 22px rgba(197, 160, 89, 0.7);
      }
    }

    .card-img-wrap {
      width: 100%;
      aspect-ratio: 9 / 16;
      background: #18110b;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 11px 11px 0 0;
      transform: translateZ(0);
    }

    .card-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    /* KHỐI THÔNG TIN NỀN MÀU ĐỎ CHỦ ĐẠO (PRIMARY RED) */
    .card-caption {
      padding: 10px 8px 12px;
      background: linear-gradient(145deg, #8b1d1d, #701414);
      border-top: 1px solid rgba(255, 255, 255, 0.15);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      text-align: center;
    }

    .card-number-label {
      font-size: 0.92rem;
      font-weight: 700;
      color: #fef08a;
      letter-spacing: 0.6px;
    }

    .card-footer-action {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 0.75rem;
    }

    .badge-main {
      background: #c5a059;
      color: #1e130c;
      padding: 2px 8px;
      border-radius: 10px;
      font-weight: 700;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
    }

    .badge-sub {
      background: rgba(0, 0, 0, 0.28);
      color: #fef3c7;
      padding: 2px 8px;
      border-radius: 10px;
      font-weight: 600;
      border: 1px solid rgba(254, 243, 199, 0.35);
    }

    .hint-click {
      color: rgba(255, 255, 255, 0.85);
      font-size: 0.72rem;
    }

    .infinite-scroll-sentinel {
      width: 100%;
      text-align: center;
      padding: 30px 0 10px;
    }

    .sentinel-spinner {
      display: inline-block;
      color: #94a3b8;
      font-style: italic;
      font-size: 0.88rem;
      letter-spacing: 0.6px;
    }

    /* MODAL XEM CHI TIẾT: TỶ LỆ HÀI HÒA THEO CHIỀU DỌC, VỪA VẶN MÀN HÌNH */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.82);
      z-index: 9999;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 12px;
      backdrop-filter: blur(6px);
    }

    .modal-overlay.show {
      display: flex;
      animation: modalFadeIn 0.22s ease;
    }

    @keyframes modalFadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    .modal-content {
      position: relative;
      max-width: min(390px, 92vw);
      max-height: 86vh;
      height: auto;
      background: #140d09;
      border-radius: 14px;
      border: 2px solid #c5a059;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      animation: modalScaleIn 0.25s ease;
    }

    @keyframes modalScaleIn {
      from {
        transform: scale(0.92);
        opacity: 0;
      }

      to {
        transform: scale(1);
        opacity: 1;
      }
    }

    .modal-close {
      position: absolute;
      top: 8px;
      right: 10px;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.75);
      border: 1.5px solid #c5a059;
      color: #fef08a;
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
      transition: all 0.2s ease;
    }

    .modal-close:hover {
      background: var(--bk-red-primary);
      color: #fff;
      border-color: #fff;
    }

    .modal-img-wrap {
      flex: 1 1 auto;
      min-height: 0;
      max-height: calc(86vh - 65px);
      background: #0d0907;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-img {
      width: auto;
      height: 100%;
      max-width: 100%;
      max-height: calc(86vh - 65px);
      object-fit: contain;
      display: block;
    }

    .modal-info {
      flex: 0 0 auto;
      padding: 8px 12px 10px;
      text-align: center;
      background: linear-gradient(180deg, #24160f, #140d09);
      border-top: 1px solid rgba(197, 160, 89, 0.35);
    }

    .modal-info h3 {
      color: #fef08a;
      font-size: 1.05rem;
      font-weight: 700;
      margin-bottom: 2px;
      letter-spacing: 0.5px;
    }

    .modal-subtitle {
      font-size: 0.78rem;
      color: rgba(248, 241, 227, 0.8);
      font-style: italic;
    }
  </style>
</head>

<body>

  <div class="boikieu-page">
    <!-- BÀN QUAY BÓI QUẺ -->
    <div class="boikieu-stage-container">
      <div class="wheel-wrapper">
        <div class="pointer"></div>
        <div class="wheel" id="wheel">
          <img class="wheel-image" src="wheel.png" alt="Chiếc nón kỳ diệu" draggable="false">
        </div>
      </div>
      <div class="stage-controls">
        <button class="spin-btn" id="spinBtn" onclick="spinWheel()" aria-label="Xin quẻ">
          <span class="spin-btn-inner">XIN QUẺ</span>
        </button>
        <div class="result-number" id="resultText"></div>
      </div>
    </div>

    <!-- BẢNG LIỆT KÊ CÁC QUẺ KIỀU -->
    <section class="boikieu-cards-section">
      <div class="cards-section-header">
        <h2 class="cards-main-title">BẢNG LIỆT KÊ CÁC QUẺ KIỀU</h2>
        <div class="title-divider"></div>
      </div>
      <div class="cards-grid" id="cardsGrid"></div>
      <div class="infinite-scroll-sentinel" id="sentinel">
        <div class="sentinel-spinner">Đang tải thêm quẻ...</div>
      </div>
    </section>
  </div>

  <!-- MODAL XEM CHI TIẾT QUẺ FHD -->
  <div class="modal-overlay" id="modal" onclick="closeModal()">
    <div class="modal-content" onclick="event.stopPropagation()">
      <button class="modal-close" onclick="closeModal()" aria-label="Đóng">✕</button>
      <div class="modal-img-wrap">
        <img id="modalImg" class="modal-img" alt="Quẻ Kiều Chi Tiết">
      </div>
      <div class="modal-info">
        <h3 id="modalTitle">Quẻ số 1</h3>
        <p class="modal-subtitle">Tranh Kiều & Lời Giải Quẻ Chi Tiết</p>
      </div>
    </div>
  </div>

  <script>
    const WHEEL_NUMBERS = [1, 18, 36, 54, 72, 90, 108, 126, 144, 162, 180, 210];
    const SEGMENTS = WHEEL_NUMBERS.length;
    const SEG_ANGLE = 360 / SEGMENTS;

    let isSpinning = false;
    let currentRotation = 0;
    let mainQueNum = null;
    let currentLoadedCount = 0;
    const BATCH_SIZE = 24;

    function imgSrc(n) {
      const norm = ((n - 1) % 210) + 1;
      const padded = String(norm).padStart(3, '0');
      return "cards/Que-" + padded + ".png";
    }

    function spinWheel() {
      if (isSpinning) return;
      isSpinning = true;

      const btn = document.getElementById("spinBtn");
      const innerSpan = btn.querySelector(".spin-btn-inner") || btn;
      const wheel = document.getElementById("wheel");
      const resultText = document.getElementById("resultText");

      btn.disabled = true;
      innerSpan.textContent = "ĐANG QUAY...";
      resultText.textContent = "Đang bốc quẻ thiêng...";

      const stopIndex = Math.floor(Math.random() * SEGMENTS);
      const target = WHEEL_NUMBERS[stopIndex];

      const baseAngle = (360 - ((currentRotation % 360) + stopIndex * SEG_ANGLE) % 360) % 360;
      const extraSpins = (6 + Math.floor(Math.random() * 4)) * 360;
      const finalRotation = currentRotation + extraSpins + baseAngle;

      currentRotation = finalRotation;
      wheel.style.transition = "transform 4.8s cubic-bezier(0.12, 0.75, 0.08, 1)";
      wheel.style.transform = "rotate(" + finalRotation + "deg)";

      setTimeout(function () {
        resultText.innerHTML = "✦ Quẻ số <strong style='font-size:1.25em'>" + target + "</strong> ✦";
        mainQueNum = target;
        btn.disabled = false;
        innerSpan.textContent = "XIN QUẺ";
        isSpinning = false;
        updateMainCardHighlight();
        openModal(target);
      }, 4900);
    }

    function updateMainCardHighlight() {
      const cards = document.querySelectorAll(".card");
      cards.forEach(card => {
        const num = parseInt(card.dataset.num, 10);
        const badge = card.querySelector(".status-badge-container");
        if (num === mainQueNum) {
          card.classList.add("main-card");
          if (badge) badge.innerHTML = '<span class="badge-main">★ Quẻ chính</span>';
        } else {
          card.classList.remove("main-card");
          if (badge) badge.innerHTML = '<span class="badge-sub">Quẻ phụ</span>';
        }
      });
    }

    function appendCards(count) {
      const grid = document.getElementById("cardsGrid");
      const fragment = document.createDocumentFragment();

      for (let i = 0; i < count; i++) {
        const rawIndex = currentLoadedCount + i;
        const num = (rawIndex % 210) + 1;
        const isMain = num === mainQueNum;

        const card = document.createElement("div");
        card.className = "card" + (isMain ? " main-card" : "");
        card.dataset.num = num;
        card.onclick = function () { openModal(num); };

        card.innerHTML =
          '<div class="card-img-wrap">' +
          '<img src="' + imgSrc(num) + '" alt="Quẻ ' + num + '" loading="lazy" onerror="this.onerror=null;this.src=\'cards/que' + num + '.jpg\';">' +
          '</div>' +
          '<div class="card-caption">' +
          '<div class="card-number-label">QUẺ SỐ ' + num + '</div>' +
          '<div class="card-footer-action">' +
          '<span class="status-badge-container">' +
          (isMain ? '<span class="badge-main">★ Quẻ chính</span>' : '<span class="badge-sub">Quẻ phụ</span>') +
          '</span>' +
          '<span class="hint-click">Bấm để xem</span>' +
          '</div>' +
          '</div>';

        fragment.appendChild(card);
      }

      grid.appendChild(fragment);
      currentLoadedCount += count;
    }

    function openModal(num) {
      const isMain = num === mainQueNum;
      document.getElementById("modalTitle").textContent = "Quẻ số " + num + (isMain ? " ★ (Quẻ chính)" : "");
      const img = document.getElementById("modalImg");
      img.src = imgSrc(num);
      img.onerror = function () {
        this.onerror = null;
        this.src = "cards/que" + num + ".jpg";
      };
      document.getElementById("modal").classList.add("show");
      document.body.style.overflow = "hidden";
    }

    function closeModal() {
      document.getElementById("modal").classList.remove("show");
      document.body.style.overflow = "";
    }

    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape") closeModal();
    });

    window.addEventListener("DOMContentLoaded", function () {
      appendCards(BATCH_SIZE);
      const sentinel = document.getElementById("sentinel");
      if ("IntersectionObserver" in window) {
        const observer = new IntersectionObserver(function (entries) {
          if (entries[0].isIntersecting) {
            appendCards(BATCH_SIZE);
          }
        }, { rootMargin: "300px" });
        observer.observe(sentinel);
      } else {
        window.addEventListener("scroll", function () {
          if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 500) {
            appendCards(BATCH_SIZE);
          }
        });
      }
    });
  </script>
</body>

</html>
