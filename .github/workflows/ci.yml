name: CI Pipeline

on:
  push:
    branches: [ main, master, custom-ui ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies & Run Tests
        run: |
          pip install -r backend/requirements.txt
          python backend/test_engine.py

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node Dependencies & Build Frontend
        run: |
          npm ci
          npm run build
