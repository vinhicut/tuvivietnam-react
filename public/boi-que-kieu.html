<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bói Quẻ Kiều • Chiếc Nón Kỳ Diệu</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{--gold:#c9a227;--red:#8b1e1e;--cream:#f8f1e3}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Be Vietnam Pro',sans-serif;background:linear-gradient(165deg,#1a0f0a,#3d2314 50%,#1a0f0a);min-height:100vh;color:var(--cream);overflow-x:hidden}
header{text-align:center;padding:20px 12px 4px;position:relative}
header::before{content:"";position:absolute;top:0;left:0;right:0;height:5px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
h1{font-family:'Be Vietnam Pro',sans-serif;font-size:clamp(1.6rem,5vw,2.5rem);color:var(--gold);text-shadow:0 2px 12px rgba(0,0,0,.7);letter-spacing:2px}
.subtitle{font-size:.95rem;opacity:.85;margin-top:3px;font-style:italic}
.container{max-width:1280px;margin:0 auto;padding:4px 12px 40px}
.spinner-section{display:flex;flex-direction:column;align-items:center;gap:14px;margin:14px 0 22px}
.wheel-wrapper{position:relative;width:min(320px,88vw);height:min(320px,88vw)}
.wheel{width:100%;height:100%;border-radius:50%;background:conic-gradient(from 0deg,#8b1e1e 0 30deg,#c9a227 30deg 60deg,#2e5a3c 60deg 90deg,#8b1e1e 90deg 120deg,#c9a227 120deg 150deg,#2e5a3c 150deg 180deg,#8b1e1e 180deg 210deg,#c9a227 210deg 240deg,#2e5a3c 240deg 270deg,#8b1e1e 270deg 300deg,#c9a227 300deg 330deg,#2e5a3c 330deg 360deg);border:9px solid var(--gold);box-shadow:0 0 0 5px #2c1810,0 0 30px rgba(201,162,39,.45),inset 0 0 40px rgba(0,0,0,.55);transition:transform 4.5s cubic-bezier(.12,.75,.08,1);position:relative;overflow:hidden}
.wheel-numbers{position:absolute;inset:0;border-radius:50%;pointer-events:none;z-index:1}
.wheel-numbers span{position:absolute;left:50%;top:50%;width:30px;height:22px;margin-left:-15px;margin-top:-11px;font-size:.7rem;font-weight:700;color:#f8e9b0;text-shadow:0 1px 3px #000;display:flex;align-items:center;justify-content:center}
.wheel::after{content:"";position:absolute;inset:22%;border-radius:50%;background:radial-gradient(circle,#3d2314 20%,#1a0f0a 100%);border:3px solid var(--gold);z-index:2}
.wheel-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:62px;height:62px;background:linear-gradient(145deg,#c9a227,#8b6b1a);border-radius:50%;border:3px solid #f8e9b0;z-index:5;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:1.15rem;color:#2c1810;box-shadow:0 3px 12px rgba(0,0,0,.5)}
.pointer{position:absolute;top:-15px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:15px solid transparent;border-right:15px solid transparent;border-top:30px solid var(--gold);filter:drop-shadow(0 3px 6px rgba(0,0,0,.5));z-index:10}
.spin-btn{background:linear-gradient(145deg,#c9a227,#a07d1a);color:#2c1810;border:none;padding:12px 38px;font-size:1.2rem;font-weight:700;border-radius:50px;cursor:pointer;box-shadow:0 5px 18px rgba(201,162,39,.4);transition:all .25s;font-family:'Be Vietnam Pro',sans-serif;letter-spacing:1px}
.spin-btn:hover:not(:disabled){transform:translateY(-3px);box-shadow:0 9px 22px rgba(201,162,39,.55)}
.spin-btn:disabled{opacity:.55;cursor:not-allowed}
.result-number{font-size:1.4rem;color:var(--gold);min-height:36px;font-weight:700;letter-spacing:1px}
.cards-title{text-align:center;font-size:1.25rem;color:var(--gold);margin:6px 0 16px}
.cards-title::after{content:"";display:block;width:90px;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:5px auto 0}
.cards-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;justify-items:center}
@media(max-width:900px){.cards-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:480px){.cards-grid{grid-template-columns:1fr 1fr;gap:10px}}
.card{width:100%;max-width:230px;background:linear-gradient(160deg,#f8f1e3,#e8d9b8);border-radius:12px;overflow:hidden;box-shadow:0 7px 20px rgba(0,0,0,.45);border:3px solid var(--gold);cursor:pointer;transition:transform .28s,box-shadow .28s}
.card:hover{transform:translateY(-5px) scale(1.03);box-shadow:0 12px 28px rgba(201,162,39,.4)}
.card.main-card{border-width:4px;box-shadow:0 9px 26px rgba(201,162,39,.55)}
.card-img-wrap{width:100%;aspect-ratio:3/4;background:#2c1810;overflow:hidden;display:flex;align-items:center;justify-content:center}
.card-img-wrap img{width:100%;height:100%;object-fit:cover;display:block}
.card-header{background:linear-gradient(90deg,#8b1e1e,#a52a2a);color:#f8e9b0;text-align:center;padding:6px 5px;font-weight:700;font-size:.95rem;letter-spacing:1px}
.card-body{padding:8px;color:#2c1810;min-height:64px;display:flex;flex-direction:column;justify-content:center}
.verse{font-size:.78rem;line-height:1.4;text-align:center;font-weight:500}
.verse .line1{margin-bottom:2px}
.card-footer{background:#2c1810;color:var(--gold);text-align:center;padding:4px;font-size:.72rem}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.86);z-index:1000;display:none;align-items:center;justify-content:center;padding:12px;backdrop-filter:blur(5px)}
.modal-overlay.show{display:flex;animation:fadeIn .22s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal-content{position:relative;max-width:min(400px,94vw);max-height:92vh;background:#1a0f0a;border-radius:14px;border:4px solid var(--gold);box-shadow:0 0 40px rgba(201,162,39,.4);overflow:hidden;animation:scaleIn .28s ease}
@keyframes scaleIn{from{transform:scale(.88);opacity:0}to{transform:scale(1);opacity:1}}
.modal-img{width:100%;display:block;max-height:75vh;object-fit:contain;background:#2c1810}
.modal-info{padding:10px 14px 14px;text-align:center;background:linear-gradient(180deg,#2c1810,#1a0f0a)}
.modal-info h3{color:var(--gold);font-size:1.25rem;margin-bottom:5px}
.modal-info p{font-size:.9rem;line-height:1.5}
.modal-close{position:absolute;top:8px;right:10px;width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,.65);border:2px solid var(--gold);color:var(--gold);font-size:1.35rem;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:10}
.modal-close:hover{background:var(--red)}
footer{text-align:center;padding:18px 12px 30px;font-size:.82rem;opacity:.65}
</style>
</head>
<body>
<header><h1>BÓI QUẺ KIỀU</h1><p class="subtitle">Chiếc Nón Kỳ Diệu • 210 Quẻ từ Truyện Kiều</p></header>
<div class="container">
<section class="spinner-section">
<div class="wheel-wrapper">
<div class="pointer"></div>
<div class="wheel" id="wheel"><div class="wheel-numbers" id="wheelNums"></div></div>
<div class="wheel-center" id="centerNum">?</div>
</div>
<button class="spin-btn" id="spinBtn" onclick="spinWheel()">QUAY NÓN</button>
<div class="result-number" id="resultText">Nhấn nút để quay số quẻ (1–210)</div>
</section>
<h2 class="cards-title">Tám Quẻ Được Chọn</h2>
<div class="cards-grid" id="cardsContainer"></div>
</div>
<footer>Tham vấn thi thánh Nguyễn Du • Đạo cô Tam Hợp • Sư trưởng Giác Duyên • Giáng tiên Thúy Kiều</footer>
<div class="modal-overlay" id="modal" onclick="if(event.target===this)closeModal()">
<div class="modal-content">
<button class="modal-close" onclick="closeModal()">&times;</button>
<img class="modal-img" id="modalImg" src="" alt="Quẻ">
<div class="modal-info"><h3 id="modalTitle">Quẻ</h3><p id="modalVerse"></p></div>
</div>
</div>
<script>
const queData={};for(let i=1;i<=210;i++)queData[i]={l1:"Quẻ số "+i,l2:"Hai câu lục bát từ Truyện Kiều"};
Object.assign(queData,{1:{l1:"Thông minh vốn sẵn tính trời",l2:"Nhẹ nhàng kiếp trước, đền bồi duyên sau"},2:{l1:"Tan sương vừa rạng ngày mai",l2:"Trụ trì nghe tiếng rước mời vào trong"},3:{l1:"Nâu sồng từ trở màu thiền",l2:"Mặn khen nét bút càng nhìn càng tươi"},4:{l1:"Bây giờ rõ mặt đôi ta",l2:"Tu là cội phúc, tình là dây oan"},5:{l1:"Song thu đã khép cánh ngoài",l2:"Hay là khổ tận đến ngày cam lai?"},101:{l1:"Trời còn để có hôm nay",l2:"Của tin gọi một chút này làm ghi"},102:{l1:"Trùng sinh ân nặng bể trời",l2:"Mà lòng trọng nghĩa khinh tài xiết bao!"},150:{l1:"Thường vì hạnh trọng vì tài",l2:"Sao cho trong ấm thì ngoài mới êm"},200:{l1:"Ai ngờ lại hợp một nhà",l2:"Một thiên tuyệt bút gọi là để sau"},210:{l1:"Gió quang mây tạnh thảnh thơi",l2:"Có người đàn việt lên chơi cửa già"}});
function imgSrc(n){return "cards/que"+n+".jpg"}
function buildWheelNumbers(){const el=document.getElementById("wheelNums");el.innerHTML="";const used=new Set();for(let i=0;i<24;i++){let num;do{num=Math.floor(Math.random()*210)+1}while(used.has(num));used.add(num);const angle=i*15;const span=document.createElement("span");span.textContent=num;const rad=(angle-90)*Math.PI/180;span.style.left="calc(50% + "+(Math.cos(rad)*42)+"%)";span.style.top="calc(50% + "+(Math.sin(rad)*42)+"%)";el.appendChild(span)}}
let isSpinning=false;
function spinWheel(){if(isSpinning)return;isSpinning=true;const btn=document.getElementById("spinBtn"),wheel=document.getElementById("wheel"),center=document.getElementById("centerNum"),resultText=document.getElementById("resultText");btn.disabled=true;resultText.textContent="Đang quay nón...";center.textContent="...";buildWheelNumbers();const target=Math.floor(Math.random()*210)+1;const extra=6+Math.floor(Math.random()*5);wheel.style.transform="rotate("+(extra*360+(target%24)*15)+"deg)";setTimeout(function(){center.textContent=target;resultText.innerHTML="✦ Quẻ số <strong style='font-size:1.35em'>"+target+"</strong> ✦";showEightCards(target);openModal(target);btn.disabled=false;isSpinning=false},4600)}
function showEightCards(mainNum){const container=document.getElementById("cardsContainer");container.innerHTML="";const others=new Set();while(others.size<7){const n=Math.floor(Math.random()*210)+1;if(n!==mainNum)others.add(n)}const nums=[mainNum].concat(Array.from(others));nums.forEach(function(num,idx){const data=queData[num],isMain=idx===0,card=document.createElement("div");card.className="card"+(isMain?" main-card":"");card.onclick=function(){openModal(num)};card.innerHTML='<div class="card-header">QUẺ '+num+'</div><div class="card-img-wrap"><img src="'+imgSrc(num)+'" alt="Quẻ '+num+'" loading="lazy" onerror="this.parentElement.innerHTML=\'<div style=color:#f8e9b0;text-align:center;padding:20px>Quẻ '+num+'</div>\'"></div><div class="card-body"><div class="verse"><div class="line1">'+data.l1+'</div><div>'+data.l2+'</div></div></div><div class="card-footer">'+(isMain?"★ Quẻ chính":"Quẻ phụ")+" • Bấm xem</div>";container.appendChild(card)})}
function openModal(num){const data=queData[num];document.getElementById("modalTitle").textContent="Quẻ số "+num;document.getElementById("modalVerse").innerHTML=data.l1+"<br>"+data.l2;const img=document.getElementById("modalImg");img.style.display="block";img.src=imgSrc(num);img.onerror=function(){img.style.display="none"};document.getElementById("modal").classList.add("show");document.body.style.overflow="hidden"}
function closeModal(){document.getElementById("modal").classList.remove("show");document.body.style.overflow=""}
document.addEventListener("keydown",function(e){if(e.key==="Escape")closeModal()});
window.onload=function(){buildWheelNumbers();showEightCards(Math.floor(Math.random()*210)+1)};
</script>
</body>
</html>
